<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="chentoAdminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#chentoAdminBg)" />

  <!-- Subtle Interior Rim Light -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- "100" Logo Text with bold optical presence -->
  <text
    x="236"
    y="324"
    font-family="Liberation Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="216"
    font-weight="900"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-10"
    filter="url(#subtleGlow)"
  >100</text>

  <!-- Signature Chento Amber Accent Dot -->
  <circle cx="422" cy="326" r="18" fill="url(#amberGold)" filter="url(#subtleGlow)" />
</svg>
